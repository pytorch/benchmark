iters: 50
warmup_iters: 50
save_results_to: "/path/to/results/all_reduce_sweep_%D.csv"
axes:
  ax:  # Create a axis explicitly
    team_size: 16
    team_stride: 1
patterns:
  # torch_all_reduce
