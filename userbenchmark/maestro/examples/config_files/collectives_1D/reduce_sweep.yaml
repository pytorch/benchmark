iters: 3
warmup_iters: 50
save_results_to: "/path/to/results/reduce_sweep_%D.csv"
axes:
  ax:  # Create a axis explicitly
    team_size: 16
    team_stride: 1
patterns:
  # torch_reduce
  - name: "reduce_1M"
    ops:
      - block: "torch_reduce"
        axis: ax
        vector_size: 1M
  - name: "reduce_2M"
    ops:
      - block: "torch_reduce"
        axis: ax
        vector_size: 2M
  - name: "reduce_4M"
    ops:
      - block: "torch_reduce"
        axis: ax
        vector_size: 4M
  - name: "reduce_8M"
