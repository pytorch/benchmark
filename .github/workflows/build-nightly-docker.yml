name: TorchBench Nightly Docker Build

on:
  schedule:
    # Push the nightly docker daily at 3 PM UTC
    - cron: '0 15 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-nightly-docker.yml
      - docker/torchbench-nightly.dockerfile

env:
  DOCKER_IMAGE: 'ghcr.io/pytorch/torchbench'
  BUILD_CACHE: 'type=registry,ref=ghcr.io/pytorch/torchbench:buildcache'

jobs:
  build-push-docker:
    if: ${{ github.repository_owner == 'pytorch' }}
    runs-on: mt-l-x86iavx512-16-128
    container:
      # Only needs the docker CLI: the build itself runs on the remote BuildKit
      # pool, not here.
      image: ghcr.io/actions/actions-runner:latest
    # That image defaults `run:` to sh, and these steps are bash.
    defaults:
      run:
        shell: bash
    environment: docker-s3-upload
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: pytorch
          password: ${{ secrets.TORCHBENCH_ACCESS_TOKEN }}

      - name: Export the torch version out of the image
        uses: pytorch/test-infra/.github/actions/docker-build-remote-buildkit@main
        with:
          # No structured input can express --output, so drive buildx directly.
          # RUNNER_TEMP, not ${{ runner.temp }}: the expression resolves to the
          # host path, which does not exist inside this container.
          command: >-
            docker buildx build --platform linux/amd64
            --file docker/torchbench-nightly.dockerfile
            --target version-export
            --cache-from "${BUILD_CACHE}"
            --output "type=local,dest=${RUNNER_TEMP}/version"
            .

      - name: Derive the nightly tag
        id: tag
        run: |
          set -euo pipefail

          PYTORCH_VERSION=$(tail -n1 "${RUNNER_TEMP}/version/torch_version")
          # Was gawk's 3-arg match(), which is a GNU extension.
          DOCKER_TAG=$(grep -oE 'dev[0-9]+' <<< "${PYTORCH_VERSION}")
          echo "Tagging ${PYTORCH_VERSION} as ${DOCKER_TAG}"
          echo "docker-tag=${DOCKER_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push the nightly docker
        uses: pytorch/test-infra/.github/actions/docker-build-remote-buildkit@main
        with:
          context: .
          file: docker/torchbench-nightly.dockerfile
          target: image
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.docker-tag }}
          # Every layer is already cached by the export build above, but that
          # ran on whichever builder the pool handed out, so pull the cache from
          # the registry rather than assuming the same pod twice.
          cache-from: ${{ env.BUILD_CACHE }}
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=ghcr.io/pytorch/torchbench:buildcache,mode=max' || '' }}
          push: ${{ github.event_name != 'pull_request' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true
