name: TorchBench PR Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: cpu
            runner: mt-l-x86iavx512-94-192
            gpu-flag: ''
          - config: cuda
            runner: mt-l-x86iavx512-11-125-a100
            gpu-flag: '--gpus all'
    name: Test ${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/pytorch/torchbench:latest
      options: ${{ matrix.gpu-flag }}
    environment: docker-s3-upload
    timeout-minutes: 240
    steps:
      - name: Checkout TorchBench
        uses: actions/checkout@v5

      - name: Point the HuggingFace cache somewhere writable
        shell: bash
        run: |
          set -euo pipefail

          # Models are read from the shared read-only /mnt/hf_cache mount, but
          # everything HF writes regardless -- stored_tokens, hub/.locks, the
          # arrow build of a seeded dataset -- has to go somewhere writable or
          # it fails with "[Errno 30] Read-only file system".
          if [[ -d /mnt/hf_cache ]]; then
            mkdir -p "${RUNNER_TEMP}/hf_home" "${RUNNER_TEMP}/hf_datasets"
            if [[ -d /mnt/hf_cache/datasets ]]; then
              cp -a /mnt/hf_cache/datasets/. "${RUNNER_TEMP}/hf_datasets/" 2>/dev/null || true
            fi
            {
              echo "HF_HOME=${RUNNER_TEMP}/hf_home"
              echo "HF_HUB_CACHE=/mnt/hf_cache/hub"
              echo "HF_DATASETS_CACHE=${RUNNER_TEMP}/hf_datasets"
            } >> "${GITHUB_ENV}"
          fi

      - name: Test TorchBench
        shell: bash
        env:
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
          TEST_CONFIG: ${{ matrix.config }}
        run: |
          set -eux

          bash .ci/torchbench/install.sh
          bash .ci/torchbench/test.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true
