name: TorchBench PR Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: cpu
            runner: mt-l-x86iavx512-94-192
            gpu-flag: ''
          - config: cuda
            runner: mt-l-x86iavx512-11-125-a100
            gpu-flag: '--gpus all'
    name: Test ${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/pytorch/torchbench:latest
      options: ${{ matrix.gpu-flag }}
    environment: docker-s3-upload
    timeout-minutes: 240
    steps:
      - name: Checkout TorchBench
        uses: actions/checkout@v5

      - name: Point the HuggingFace cache somewhere writable
        shell: bash
        run: |
          set -euo pipefail

          # Ignore the shared read-only /mnt/hf_cache mount and download fresh.
          # install.py pulls the whole hf_* model set, and most of it is the
          # legacy un-namespaced ids (gpt2, t5-base, albert-base-v2) that cache
          # under a different directory than their namespaced aliases, so the
          # mount would have to be kept in step with this list in every region
          # to be worth reading from.
          mkdir -p "${RUNNER_TEMP}/hf_home" "${RUNNER_TEMP}/hf_datasets"
          {
            echo "HF_HOME=${RUNNER_TEMP}/hf_home"
            echo "HF_HUB_CACHE=${RUNNER_TEMP}/hf_home/hub"
            echo "HF_DATASETS_CACHE=${RUNNER_TEMP}/hf_datasets"
          } >> "${GITHUB_ENV}"

      - name: Test TorchBench
        shell: bash
        env:
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
          TEST_CONFIG: ${{ matrix.config }}
        run: |
          set -eux

          bash .ci/torchbench/install.sh
          bash .ci/torchbench/test.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true
